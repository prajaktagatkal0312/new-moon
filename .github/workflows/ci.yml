name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          
      - name: Update Compact Compiler
        run: compact update
          
      - name: Compile MoonVow Contract
        run: npm run compile
        
      - name: Compile Credentials Contract
        run: npm run compile:credentials
        
      - name: Run MoonVow Tests
        run: npm run test
        
      - name: Run Credentials Tests
        run: npm run test:credentials

      - name: Upload compiled credentials
        uses: actions/upload-artifact@v4
        with:
          name: compiled-credentials
          path: contracts/managed/credentials
