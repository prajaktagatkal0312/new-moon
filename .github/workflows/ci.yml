name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> $GITHUB_PATH

      - name: Update Compact Compiler
        run: compact update 0.31.1

      - name: Install dependencies
        run: npm install

      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install -y aha wkhtmltopdf

      - name: Compile MoonVow Contract
        run: npm run compile 2>&1 | tee compile-output.txt

      - name: Generate compile screenshot PNG
        run: |
          cat compile-output.txt | aha --no-header > compile-output.html
          wkhtmltoimage --width 800 --quality 100 compile-output.html docs/screenshot-compile.png

      - name: Upload compile screenshot
        uses: actions/upload-artifact@v4
        with:
          name: compile-screenshot
          path: docs/screenshot-compile.png

      - name: Run MoonVow Tests
        run: npm test

      - name: Build Frontend
        run: npm --prefix frontend install && npm run frontend:build
