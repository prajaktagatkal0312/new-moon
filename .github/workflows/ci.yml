name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> $GITHUB_PATH

      - name: Update Compact Compiler
        run: compact update

      - name: Install dependencies
        run: npm install

      - name: Compile MoonVow Contract
        run: npm run compile 2>&1 | tee compile-output.txt

      - name: Run MoonVow Tests
        run: npm test || true

      - name: Build Frontend
        run: npm --prefix frontend install && npm run frontend:build

      - name: Commit to branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b logs-branch
          git add compile-output.txt contracts/managed/
          git commit -m "logs"
          git push -u origin logs-branch -f
