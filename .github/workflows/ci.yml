name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install Compact CLI
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
        echo "$HOME/.compact/bin" >> $GITHUB_PATH

    - name: Update Compact Compiler
      run: compact update

    - name: Install dependencies
      run: npm install

    - name: Compile Contract
      run: |
        npm run compile > compile_log.txt 2>&1 || true

    - name: Run Contract Tests
      run: |
        npm test > test_log.txt 2>&1 || true

    - name: Build Frontend
      run: |
        npm --prefix frontend install
        npm run frontend:build > build_log.txt 2>&1 || true

    - name: Commit logs
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add compile_log.txt test_log.txt build_log.txt
        git commit -m "chore: upload logs"
        git push
